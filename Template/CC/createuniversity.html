{% extends 'base.html' %}
{% block content %}
{% load static %}

<style>
    :root {
        --primary-blue: #2c3e50; /* Dark Blue */
        --secondary-blue: #3498db; /* Medium Blue */
        --light-blue: #98c1ff; /* Light Blue */
        --dark-blue: #2980b9; /* Darker Blue */
        --white: #FFFFFF;
        --soft-white: rgba(255, 255, 255, 0.9);
        --card-bg: rgba(255, 255, 255, 0.96);
        --card-border: rgba(44, 62, 80, 0.1);
        --text-dark: #2c3e50;
        --text-medium: #555555;
        --text-light: #7f8c8d;
        --shadow-light: 0 4px 20px rgba(0, 0, 0, 0.08);
        --shadow-hover: 0 12px 30px rgba(44, 62, 80, 0.2);
    }
    
    /* Particle Background Canvas */
    #particles-js {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: -1;
        background-color: white;
    }
    
    /* Form Container */
    .form-container {
        width: 100%;
        max-width: 600px;
        margin: 4rem auto;
        padding: 0 1rem;
        opacity: 0;
        animation: fadeIn 0.8s forwards 0.3s;
    }
    
    /* Form Styling */
    form {
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(44, 62, 80, 0.1);
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        animation: slideInUp 0.6s ease-out;
    }

    form p {
        margin-bottom: 1.5rem;
        position: relative;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--primary-blue);
        font-weight: 600;
        font-size: 0.95rem;
        animation: slideInLeft 0.4s ease-out;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="file"],
    textarea,
    select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #D7CCC8;
        border-radius: 8px;
        background-color: var(--white);
        transition: all 0.3s ease;
        animation: fadeIn 0.5s ease-out;
        font-family: 'Montserrat', sans-serif;
        font-size: 0.95rem;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.2);
        outline: none;
    }

    input[type="submit"] {
        background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
        color: white;
        border: none;
        padding: 14px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        animation: pulse 2s infinite;
        width: 100%;
        font-size: 1rem;
        margin-top: 1rem;
    }

    input[type="submit"]:hover {
        background: linear-gradient(135deg, var(--secondary-blue), var(--primary-blue));
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(44, 62, 80, 0.3);
    }

    /* Form title */
    .form-title {
        text-align: center;
        color: var(--primary-blue);
        margin-bottom: 2rem;
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 1.8rem;
        position: relative;
    }

    .form-title::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 3px;
        background: linear-gradient(90deg, var(--primary-blue), var(--secondary-blue));
        border-radius: 2px;
    }

    /* File input styling */
    input[type="file"] {
        padding: 8px;
        border: 2px dashed #D7CCC8;
        background-color: rgba(44, 62, 80, 0.03);
        transition: all 0.3s ease;
    }

    input[type="file"]:hover {
        border-color: var(--primary-blue);
        background-color: rgba(44, 62, 80, 0.05);
    }

    /* Textarea specific styling */
    textarea {
        min-height: 120px;
        resize: vertical;
    }

    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes slideInLeft {
        from {
            opacity: 0;
            transform: translateX(-20px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    @keyframes slideInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes pulse {
        0% {
            box-shadow: 0 0 0 0 rgba(44, 62, 80, 0.4);
        }
        70% {
            box-shadow: 0 0 0 10px rgba(44, 62, 80, 0);
        }
        100% {
            box-shadow: 0 0 0 0 rgba(44, 62, 80, 0);
        }
    }

    /* Stagger animations for form elements */
    form p:nth-child(1) { animation-delay: 0.1s; }
    form p:nth-child(2) { animation-delay: 0.2s; }
    form p:nth-child(3) { animation-delay: 0.3s; }
    form p:nth-child(4) { animation-delay: 0.4s; }
    form p:nth-child(5) { animation-delay: 0.5s; }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .form-container {
            margin: 2rem auto;
            padding: 0 0.5rem;
        }
        
        form {
            padding: 2rem 1.5rem;
        }
        
        .form-title {
            font-size: 1.5rem;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="file"],
        textarea,
        select {
            padding: 10px 14px;
            font-size: 0.9rem;
        }
        
        input[type="submit"] {
            padding: 12px 20px;
            font-size: 0.9rem;
        }
    }

    @media (max-width: 480px) {
        form {
            padding: 1.5rem 1rem;
        }
        
        .form-title {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
        }
        
        label {
            font-size: 0.9rem;
        }
    }
</style>

<!-- Particle Background -->
<div id="particles-js"></div>

<div class="form-container">
    <h2 class="form-title">Upload Institute</h2>
    <form action="" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{form.as_p}}
        <input type="submit" name="submit" value="Submit">
    </form>
</div>

<!-- Particles.js library -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize particles.js with blue theme
        particlesJS('particles-js', {
            "particles": {
                "number": {
                    "value": 100,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": "#3498db" // Blue color
                },
                "shape": {
                    "type": "circle",
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    }
                },
                "opacity": {
                    "value": 0.5,
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 1,
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 3,
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 2,
                        "size_min": 0.1,
                        "sync": false
                    }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#3498db",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 2,
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": true,
                        "rotateX": 600,
                        "rotateY": 1200
                    }
                }
            },
            "interactivity": {
                "detect_on": "window",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "grab"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    },
                    "resize": true
                },
                "modes": {
                    "grab": {
                        "distance": 150,
                        "line_linked": {
                            "opacity": 1
                        }
                    },
                    "bubble": {
                        "distance": 400,
                        "size": 40,
                        "duration": 2,
                        "opacity": 8,
                        "speed": 3
                    },
                    "repulse": {
                        "distance": 200,
                        "duration": 0.4
                    },
                    "push": {
                        "particles_nb": 4
                    },
                    "remove": {
                        "particles_nb": 2
                    }
                }
            },
            "retina_detect": true
        });
        
        // Add custom mouse interaction for stronger particle attraction
        document.addEventListener('mousemove', function(e) {
            if (typeof particlesJS !== 'undefined' && particlesJS.particles && particlesJS.particles.array) {
                // Get the mouse position
                var mouseX = e.clientX;
                var mouseY = e.clientY;
                
                // Get all particles
                var particles = particlesJS.particles.array;
                
                // Attract particles to mouse position
                for (var i = 0; i < particles.length; i++) {
                    var particle = particles[i];
                    var dx = mouseX - particle.x;
                    var dy = mouseY - particle.y;
                    var distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // Only affect particles within a certain distance
                    if (distance < 200) {
                        var forceDirectionX = dx / distance;
                        var forceDirectionY = dy / distance;
                        var force = (200 - distance) / 200 * 3; // Stronger when closer
                        
                        // Apply force to particle velocity
                        particle.vx = forceDirectionX * force;
                        particle.vy = forceDirectionY * force;
                    }
                }
            }
        });
        
        // Enhanced form interactions
        const formInputs = document.querySelectorAll('input, textarea, select');
        
        formInputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.transform = 'translateY(-2px)';
                input.parentElement.style.transition = 'transform 0.3s ease';
            });
            
            input.addEventListener('blur', () => {
                input.parentElement.style.transform = 'translateY(0)';
            });
        });
    });
</script>

{% endblock %}
