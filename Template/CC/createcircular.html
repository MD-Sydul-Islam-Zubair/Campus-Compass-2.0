{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    :root {
        /* Blue Theme Color Variables */
        --primary-blue: #2c3e50;  /* Dark Blue */
        --secondary-blue: #3498db; /* Medium Blue */
        --light-blue: #98c1ff;    /* Light Blue */
        --card-bg: rgba(44, 62, 80, 0.1);
        --card-border: rgba(52, 152, 219, 0.3);
        --text-glow: 0 0 15px rgba(52, 152, 219, 0.4);
        --modal-bg: rgba(240, 245, 250, 0.96);
        --modal-border: rgba(44, 62, 80, 0.15);
        --hover-glow: 0 0 20px rgba(52, 152, 219, 0.3);
    }
    
    /* Particle Background Canvas */
    #particles-js {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: -1;
        background-color: white;
    }
    
    /* Base Card Styles */
    .circular-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        border: 1px solid var(--card-border);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(44, 62, 80, 0.25);
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 450px;
        position: relative;
        z-index: 1;
    }

    /* Card Hover Effects */
    .circular-card:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 20px 40px rgba(44, 62, 80, 0.35), 
                    var(--hover-glow);
        border-color: var(--light-blue);
    }

    .circular-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
            135deg, 
            rgba(44, 62, 80, 0.2) 0%, 
            transparent 70%
        );
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: -1;
    }

    .circular-card:hover::before {
        opacity: 1;
    }

    /* Card Content Styles */
    .circular-image-container {
        height: 280px;
        overflow: hidden;
        position: relative;
    }

    .institute-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.7s ease;
    }

    .institute-logo {
        position: absolute;
        bottom: -25px;
        right: 25px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 3px solid white;
        background: white;
        object-fit: contain;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        z-index: 2;
        transition: all 0.4s ease;
    }

    .circular-card:hover .institute-logo {
        transform: scale(1.15) rotate(5deg);
        box-shadow: 0 15px 35px rgba(0,0,0,0.35);
    }

    .circular-content {
        padding: 2rem;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    .institute-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        color: var(--primary-blue);
        text-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .admission-period {
        font-size: 1.05rem;
        background: rgba(44, 62, 80, 0.35);
        color: white;
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border-radius: 50px;
        margin-bottom: 1.25rem;
        backdrop-filter: blur(5px);
        box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
    }

    .view-details-btn {
        background: var(--primary-blue);
        color: white;
        border: none;
        border-radius: 50px;
        padding: 0.8rem 2rem;
        font-weight: 500;
        margin-top: auto;
        align-self: flex-start;
        transition: all 0.3s ease;
        box-shadow: 0 5px 20px rgba(44, 62, 80, 0.35);
        position: relative;
        overflow: hidden;
    }

    .view-details-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            90deg, 
            transparent, 
            rgba(255,255,255,0.25), 
            transparent
        );
        transition: 0.6s;
    }

    .view-details-btn:hover {
        background: var(--secondary-blue);
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(44, 62, 80, 0.45);
    }

    .view-details-btn:hover::before {
        left: 100%;
    }

    /* Modal Styles */
    .modal-backdrop {
        background-color: transparent !important;
        backdrop-filter: blur(20px);
        opacity: 1 !important;
    }

    .modal-backdrop.show {
        opacity: 1 !important;
    }

    .circular-modal .modal-content,
    .contact-info-modal .modal-content,
    .update-modal .modal-content,
    .delete-modal .modal-content {
        background: var(--modal-bg);
        border-radius: 20px;
        color: var(--primary-blue);
        border: 1px solid var(--modal-border);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        transform: scale(0.95);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        overflow: hidden;
    }

    .modal.show .modal-content {
        transform: scale(1);
    }

    .modal-header {
        border-bottom: 1px solid var(--modal-border);
        background: rgba(240, 245, 250, 0.8);
        padding: 1.75rem;
    }

    .modal-title {
        font-weight: 600;
        font-size: 1.75rem;
        display: flex;
        align-items: center;
        color: var(--primary-blue);
    }

    .modal-title i {
        margin-right: 15px;
        color: var(--secondary-blue);
        font-size: 1.5rem;
    }

    /* Circular Modal Specific */
    .modal-image-content {
        position: relative;
        overflow: hidden;
        cursor: zoom-in;
        height: 100%;
        touch-action: none;
    }

    .modal-image-content.zoomed {
        cursor: grab;
    }

    .modal-image-content img {
        transition: transform 0.3s ease;
        transform-origin: center center;
        width: 100%;
        height: auto;
        display: block;
    }

    .modal-image-content.zoomed:active {
        cursor: grabbing;
    }

    .zoomable-image {
        transition: transform 0.3s ease;
        transform-origin: 0 0;
        width: 100%;
        height: auto;
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-drag: none;
    }

    .zoom-controls {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 10;
        display: flex;
        gap: 10px;
        background: rgba(0,0,0,0.5);
        padding: 8px;
        border-radius: 25px;
    }

    .zoom-btn {
        width: 40px;
        height: 40px;
        background: rgba(255,255,255,0.2);
        color: white;
        border: none;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 1rem;
    }

    .zoom-btn:hover {
        background: var(--primary-blue);
        transform: scale(1.1);
    }

    .zoom-btn i {
        pointer-events: none;
    }
    .modal-image-container {
        padding: 0;
        position: relative;
        overflow: hidden;
    }

    .modal-image-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        filter: blur(12px) brightness(0.8);
        opacity: 0.3;
        z-index: 0;
        transform: scale(1.1);
    }

    .modal-image-content {
        position: relative;
        z-index: 1;
        padding: 3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 500px;
    }

    .modal-image-content img {
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
        border-radius: 15px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        transition: transform 0.5s ease;
    }

    .modal-image-content img:hover {
        transform: scale(1.03);
    }

    .modal-details-col {
        padding: 2.5rem;
        position: relative;
        z-index: 1;
    }

    .programs-container {
        background: rgba(240, 245, 250, 0.5);
        backdrop-filter: blur(15px);
        border-radius: 15px;
        padding: 2rem;
        margin-bottom: 2rem;
        border: 1px solid var(--modal-border);
        box-shadow: inset 0 0 25px rgba(255,255,255,0.1);
    }

    .programs-container h6 {
        font-size: 1.3rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        color: var(--secondary-blue);
    }

    .programs-container h6 i {
        margin-right: 12px;
    }

    .details-container {
        background: rgba(240, 245, 250, 0.5);
        backdrop-filter: blur(15px);
        border-radius: 15px;
        padding: 2rem;
        border: 1px solid var(--modal-border);
        box-shadow: inset 0 0 25px rgba(255,255,255,0.1);
    }

    /* Contact Modal Specific */
    .contact-info {
        background: rgba(240, 245, 250, 0.5);
        backdrop-filter: blur(15px);
        padding: 2rem;
        border-radius: 15px;
        margin-top: 1.5rem;
        border: 1px solid var(--modal-border);
        box-shadow: inset 0 0 25px rgba(255,255,255,0.1);
    }

    .contact-item {
        margin-bottom: 1.75rem;
        display: flex;
        align-items: flex-start;
    }

    .contact-item i {
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(52, 152, 219, 0.15);
        border-radius: 50%;
        margin-right: 18px;
        font-size: 1.2rem;
        color: var(--secondary-blue);
        flex-shrink: 0;
        border: 1px solid rgba(52, 152, 219, 0.3);
    }

    .contact-item h6 {
        font-size: 1.2rem;
        margin-bottom: 0.5rem;
        color: var(--secondary-blue);
    }

    /* Action Buttons */
    .action-buttons {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        justify-content: flex-end;
        padding: 0 2rem;
    }
    
    .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0.6rem 1.5rem;
        border-radius: 50px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        border: none;
        font-size: 0.9rem;
    }
    
    .update-btn {
        background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
        color: white;
    }
    
    .update-btn:hover {
        background: linear-gradient(135deg, var(--secondary-blue), var(--primary-blue));
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(44, 62, 80, 0.4);
    }
    
    .delete-btn {
        background: linear-gradient(135deg, #e74c3c, #c0392b);
        color: white;
    }
    
    .delete-btn:hover {
        background: linear-gradient(135deg, #c0392b, #e74c3c);
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(192, 57, 43, 0.4);
    }

    /* Delete Confirmation Modal */
    .delete-modal .modal-content {
        background: var(--modal-bg);
        border-radius: 20px;
        color: var(--primary-blue);
        border: 1px solid var(--modal-border);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        transform: scale(0.95);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        overflow: hidden;
        max-width: 500px;
        text-align: center;
        padding: 2rem;
    }
    
    .delete-modal .confirmation-icon {
        font-size: 3.5rem;
        color: #e74c3c;
        margin: 1rem 0;
    }
    
    .delete-modal .modal-title {
        color: #e74c3c;
        margin-bottom: 1rem;
    }
    
    .delete-modal .confirmation-text {
        margin-bottom: 2rem;
    }
    
    .delete-modal .modal-actions {
        display: flex;
        justify-content: center;
        gap: 1rem;
    }

    /* Buttons */
    .btn-outline-light {
        border: 2px solid rgba(44, 62, 80, 0.25);
        background: transparent;
        color: var(--primary-blue);
        padding: 0.7rem 1.8rem;
        transition: all 0.3s ease;
    }

    .btn-outline-light:hover {
        background: rgba(44, 62, 80, 0.1);
        border-color: var(--primary-blue);
        color: var(--primary-blue);
    }

    .btn-primary {
        background: var(--primary-blue);
        border: none;
        padding: 0.8rem 2rem;
        font-weight: 500;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(44, 62, 80, 0.4);
    }

    .btn-primary:hover {
        background: var(--secondary-blue);
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(44, 62, 80, 0.5);
    }

    .btn-danger {
        background: #e74c3c;
        border: none;
        padding: 0.8rem 2rem;
        font-weight: 500;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
    }

    .btn-danger:hover {
        background: #c0392b;
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(192, 57, 43, 0.5);
    }

    /* Animations */
    @keyframes fadeInScale {
        from {
            opacity: 0;
            transform: scale(0.95) translateY(20px);
        }
        to {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    }

    @keyframes modalEntry {
        0% {
            opacity: 0;
            transform: translateY(50px) scale(0.95);
        }
        50% {
            opacity: 1;
            transform: translateY(-10px) scale(1.02);
        }
        100% {
            transform: translateY(0) scale(1);
        }
    }

    @keyframes modalBgFade {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .modal.fade .modal-dialog {
        animation: modalEntry 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .modal-backdrop.fade {
        animation: modalBgFade 0.4s ease forwards;
    }

    .modal-content {
        transform-origin: center bottom;
    }

    .modal-header {
        animation: fadeInUp 0.5s ease 0.2s both;
    }

    .modal-body {
        animation: fadeIn 0.6s ease 0.3s both;
    }

    .modal-footer {
        animation: fadeInUp 0.5s ease 0.4s both;
    }

    /* Form Styling */
    form {
        max-width: 500px;
        margin: 0 auto;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(44, 62, 80, 0.1);
        background-color: var(--modal-bg);
        animation: fadeIn 0.6s ease-out;
    }

    form p {
        margin-bottom: 20px;
        position: relative;
    }

    label {
        display: block;
        margin-bottom: 6px;
        color: var(--primary-blue);
        font-weight: 500;
        animation: slideInLeft 0.4s ease-out;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="file"],
    textarea,
    select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #D7CCC8;
        border-radius: 4px;
        background-color: white;
        transition: all 0.3s ease;
        animation: fadeIn 0.5s ease-out;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.2);
        outline: none;
    }

    input[type="submit"] {
        background-color: var(--primary-blue);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        animation: pulse 2s infinite;
    }

    input[type="submit"]:hover {
        background-color: var(--secondary-blue);
        transform: translateY(-2px);
    }

    /* Responsive Adjustments */
    @media (max-width: 1200px) {
        .modal-image-content {
            min-height: 450px;
            padding: 2.5rem;
        }
        
        .circular-card {
            min-height: 420px;
        }
    }

    @media (max-width: 992px) {
        .circular-image-container {
            height: 250px;
        }
        
        .institute-logo {
            width: 80px;
            height: 80px;
            bottom: -20px;
            right: 20px;
        }
        
        .modal-image-content {
            min-height: 400px;
            padding: 2rem;
        }
    }

    @media (max-width: 768px) {
        .circular-card {
            min-height: 380px;
        }
        
        .circular-image-container {
            height: 220px;
        }
        
        .institute-logo {
            width: 70px;
            height: 70px;
            bottom: -15px;
            right: 15px;
        }
        
        .modal-image-content {
            min-height: 350px;
            padding: 1.5rem;
        }
        
        .modal-details-col {
            padding: 1.75rem;
        }
        
        .programs-container, 
        .details-container,
        .contact-info {
            padding: 1.75rem;
        }
        
        .action-buttons {
            padding: 0 1rem;
        }
    }

    @media (max-width: 576px) {
        .circular-card {
            min-height: 350px;
        }
        
        .circular-image-container {
            height: 200px;
        }
        
        .institute-logo {
            width: 60px;
            height: 60px;
            bottom: -12px;
            right: 12px;
        }
        
        .modal-content {
            margin: 1rem;
        }
        
        .modal-image-content {
            min-height: 300px;
            padding: 1rem;
        }
        
        .modal-header {
            padding: 1.25rem;
        }
        
        .action-buttons {
            flex-direction: column;
            gap: 0.5rem;
        }
    }
</style>

<!-- Particle Background -->
<div id="particles-js"></div>

<form action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" name="submit">
</form>

<!-- Particles.js library -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize particles.js with blue theme
    particlesJS('particles-js', {
        "particles": {
            "number": {
                "value": 100,
                "density": {
                    "enable": true,
                    "value_area": 800
                }
            },
            "color": {
                "value": "#3498db" // Blue color
            },
            "shape": {
                "type": "circle",
                "stroke": {
                    "width": 0,
                    "color": "#000000"
                }
            },
            "opacity": {
                "value": 0.5,
                "random": true,
                "anim": {
                    "enable": true,
                    "speed": 1,
                    "opacity_min": 0.1,
                    "sync": false
                }
            },
            "size": {
                "value": 3,
                "random": true,
                "anim": {
                    "enable": true,
                    "speed": 2,
                    "size_min": 0.1,
                    "sync": false
                }
            },
            "line_linked": {
                "enable": true,
                "distance": 150,
                "color": "#3498db",
                "opacity": 0.4,
                "width": 1
            },
            "move": {
                "enable": true,
                "speed": 2,
                "direction": "none",
                "random": true,
                "straight": false,
                "out_mode": "out",
                "bounce": false,
                "attract": {
                    "enable": true,
                    "rotateX": 600,
                    "rotateY": 1200
                }
            }
        },
        "interactivity": {
            "detect_on": "window",
            "events": {
                "onhover": {
                    "enable": true,
                    "mode": "grab"
                },
                "onclick": {
                    "enable": true,
                    "mode": "push"
                },
                "resize": true
            },
            "modes": {
                "grab": {
                    "distance": 150,
                    "line_linked": {
                        "opacity": 1
                    }
                },
                "bubble": {
                    "distance": 400,
                    "size": 40,
                    "duration": 2,
                    "opacity": 8,
                    "speed": 3
                },
                "repulse": {
                    "distance": 200,
                    "duration": 0.4
                },
                "push": {
                    "particles_nb": 4
                },
                "remove": {
                    "particles_nb": 2
                }
            }
        },
        "retina_detect": true
    });
    
    // Add custom mouse interaction for stronger particle attraction
    document.addEventListener('mousemove', function(e) {
        if (typeof particlesJS !== 'undefined' && particlesJS.particles && particlesJS.particles.array) {
            // Get the mouse position
            var mouseX = e.clientX;
            var mouseY = e.clientY;
            
            // Get all particles
            var particles = particlesJS.particles.array;
            
            // Attract particles to mouse position
            for (var i = 0; i < particles.length; i++) {
                var particle = particles[i];
                var dx = mouseX - particle.x;
                var dy = mouseY - particle.y;
                var distance = Math.sqrt(dx * dx + dy * dy);
                
                // Only affect particles within a certain distance
                if (distance < 200) {
                    var forceDirectionX = dx / distance;
                    var forceDirectionY = dy / distance;
                    var force = (200 - distance) / 200 * 3; // Stronger when closer
                    
                    // Apply force to particle velocity
                    particle.vx = forceDirectionX * force;
                    particle.vy = forceDirectionY * force;
                }
            }
        }
    });
});
</script>

{% endblock %}
